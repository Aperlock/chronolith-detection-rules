rule: E-010_ssp_password_filter_dll_registration
cases:
  - name: Malicious SSP added to Security Packages
    should_fire: true
    events:
      - EventID: 4657
        ObjectName: '\REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
        ObjectValueName: 'Security Packages'
        OldValue: 'kerberos msv1_0 schannel wdigest tspkg pku2u cloudAP'
        NewValue: 'kerberos msv1_0 schannel wdigest tspkg pku2u cloudAP mimilib'
        OperationType: '%%1905'
        ProcessName: 'C:\Windows\regedit.exe'
        SubjectUserName: 'jsmith'
        SubjectDomainName: 'EXAMPLE'
        Computer: 'WS-01'
  - name: Malicious password filter DLL added to Notification Packages
    should_fire: true
    events:
      - EventID: 4657
        ObjectName: '\REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
        ObjectValueName: 'Notification Packages'
        OldValue: 'scecli'
        NewValue: 'scecli evilpwdflt'
        OperationType: '%%1905'
        ProcessName: 'C:\Windows\System32\reg.exe'
        SubjectUserName: 'jsmith'
        SubjectDomainName: 'EXAMPLE'
        Computer: 'FS-01'
  - name: SSP registered under the modern Lsa\OSConfig subkey
    should_fire: true
    events:
      - EventID: 4657
        ObjectName: '\REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\OSConfig'
        ObjectValueName: 'Security Packages'
        OldValue: 'kerberos msv1_0 schannel wdigest tspkg pku2u cloudAP'
        NewValue: 'kerberos msv1_0 schannel wdigest tspkg pku2u cloudAP evilssp'
        OperationType: '%%1905'
        ProcessName: 'C:\Windows\System32\reg.exe'
        SubjectUserName: 'jsmith'
        SubjectDomainName: 'EXAMPLE'
        Computer: 'DC-01'
  - name: Unrelated Lsa value change (not a package list)
    should_fire: false
    events:
      - EventID: 4657
        ObjectName: '\REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Control\Lsa'
        ObjectValueName: 'LimitBlankPasswordUse'
        OldValue: '1'
        NewValue: '0'
        OperationType: '%%1905'
        ProcessName: 'C:\Windows\System32\svchost.exe'
        SubjectUserName: 'jsmith'
        SubjectDomainName: 'EXAMPLE'
        Computer: 'WS-01'
  - name: Package value name but unrelated registry key
    should_fire: false
    events:
      - EventID: 4657
        ObjectName: '\REGISTRY\MACHINE\SOFTWARE\Vendor\App\Config'
        ObjectValueName: 'Security Packages'
        OldValue: ''
        NewValue: 'custom'
        OperationType: '%%1905'
        ProcessName: 'C:\Program Files\App\app.exe'
        SubjectUserName: 'jsmith'
        SubjectDomainName: 'EXAMPLE'
        Computer: 'WS-01'
