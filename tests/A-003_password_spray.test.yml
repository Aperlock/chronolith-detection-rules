# Test cases for A-003 - Password Spray.
# Synthetic data only. Events are oldest-first; timestamps are relative seconds.
rule: A-003_password_spray
cases:
  - name: twenty distinct accounts with bad-password failures from one source fires
    should_fire: true
    events_generator:
      count: 20
      window_seconds: 300
      template:
        EventID: 4625
        SubStatus: '0xC000006A'
        IpAddress: 10.0.0.9
        TargetUserName: user-{{i}}

  - name: nineteen distinct accounts stays under the floor
    should_fire: false
    events_generator:
      count: 19
      window_seconds: 300
      template:
        EventID: 4625
        SubStatus: '0xC000006A'
        IpAddress: 10.0.0.9
        TargetUserName: user-{{i}}

  # 0xC0000064 is "no such user" -- somebody walking a name list against the directory.
  # That is enumeration, not spray, and counting it as spray is what the SubStatus
  # discriminator exists to stop.
  - name: username enumeration against accounts that do not exist does not fire
    should_fire: false
    events_generator:
      count: 40
      window_seconds: 300
      template:
        EventID: 4625
        SubStatus: '0xC0000064'
        IpAddress: 10.0.0.9
        TargetUserName: nosuchuser-{{i}}

  # The dominant benign cause: ONE account with a stale credential failing repeatedly.
  # A lockout problem, not a spray, and the distinct-account grouping is what separates
  # them however many times it fires.
  - name: fifty failures against ONE account is not a spray
    should_fire: false
    events_generator:
      count: 50
      window_seconds: 300
      template:
        EventID: 4625
        SubStatus: '0xC000006A'
        IpAddress: 10.0.0.9
        TargetUserName: jsmith
