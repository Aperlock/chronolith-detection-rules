# Test cases for A-003 - Password Spray.
# Synthetic data only. Events are oldest-first; timestamps are relative seconds.
rule: A-003_password_spray
cases:
  - name: one source IP failing against eight distinct accounts fires
    should_fire: true
    events_generator:
      count: 8
      window_seconds: 300
      template:
        EventID: 4625
        IpAddress: 10.0.0.9
        TargetUserName: user-{{i}}

  - name: seven distinct accounts stays under the threshold
    should_fire: false
    events_generator:
      count: 7
      window_seconds: 300
      template:
        EventID: 4625
        IpAddress: 10.0.0.9
        TargetUserName: user-{{i}}

  # The dominant benign cause: ONE account with a stale credential failing repeatedly.
  # That is a lockout problem, not a spray, and the distinct-account grouping is what
  # is supposed to separate them.
  - name: fifty failures against ONE account is not a spray
    should_fire: false
    events_generator:
      count: 50
      window_seconds: 300
      template:
        EventID: 4625
        IpAddress: 10.0.0.9
        TargetUserName: jsmith
