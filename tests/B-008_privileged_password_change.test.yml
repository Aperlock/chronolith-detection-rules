# Tests for B-008 — Password Change/Reset for a Privileged Account (base selection;
# privileged-account scoping is engine-side). Synthetic data only.
rule: B-008_privileged_password_change
cases:
  - name: admin resets another account's password fires
    should_fire: true
    events:
      - { EventID: 4724, TargetUserName: 'svc-sql', SubjectUserName: attacker }
  - name: user changes own password matches (4723)
    should_fire: true
    events:
      - { EventID: 4723, TargetUserName: 'domain-admin', SubjectUserName: 'domain-admin' }
  - name: an account-enabled event does not fire
    should_fire: false
    events:
      - { EventID: 4722, TargetUserName: jsmith, SubjectUserName: admin }
