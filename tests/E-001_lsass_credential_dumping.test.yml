rule: E-001_lsass_credential_dumping
cases:
  - name: procdump full dump of lsass fires
    should_fire: true
    events:
      - EventID: 4688
        Computer: WS-01
        SubjectUserName: jsmith
        NewProcessName: 'C:\Tools\procdump64.exe'
        Image: 'C:\Tools\procdump64.exe'
        CommandLine: 'procdump64.exe -accepteula -ma lsass.exe C:\Temp\out.dmp'

  - name: rundll32 comsvcs MiniDump fires
    should_fire: true
    events:
      - EventID: 4688
        Computer: WS-01
        SubjectUserName: jsmith
        NewProcessName: 'C:\Windows\System32\rundll32.exe'
        Image: 'C:\Windows\System32\rundll32.exe'
        CommandLine: 'rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump 640 C:\Temp\lsass.dmp full'

  - name: sysmon process access to lsass with scrape mask fires
    should_fire: true
    events:
      - EventID: 10
        Computer: WS-01
        SourceImage: 'C:\Users\jsmith\AppData\Local\Temp\mimi.exe'
        TargetImage: 'C:\Windows\System32\lsass.exe'
        GrantedAccess: '0x1410'

  - name: benign process creation without lsass does not fire
    should_fire: false
    events:
      - EventID: 4688
        Computer: WS-01
        SubjectUserName: jsmith
        NewProcessName: 'C:\Tools\procdump64.exe'
        Image: 'C:\Tools\procdump64.exe'
        CommandLine: 'procdump64.exe -ma notepad.exe C:\Temp\np.dmp'

  - name: sysmon access to lsass with benign query mask does not fire
    should_fire: false
    events:
      - EventID: 10
        Computer: WS-01
        SourceImage: 'C:\Program Files\EDR\edr-agent.exe'
        TargetImage: 'C:\Windows\System32\lsass.exe'
        GrantedAccess: '0x1000'

  - name: rundll32 without MiniDump verb does not fire
    should_fire: false
    events:
      - EventID: 4688
        Computer: WS-01
        SubjectUserName: jsmith
        NewProcessName: 'C:\Windows\System32\rundll32.exe'
        Image: 'C:\Windows\System32\rundll32.exe'
        CommandLine: 'rundll32.exe shell32.dll,Control_RunDLL desk.cpl'
