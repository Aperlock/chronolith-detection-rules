# Test cases for A-007 - Kerberoasting (RC4 TGS requests).
# Synthetic data only. Events are oldest-first; timestamps are relative seconds.
rule: A-007_kerberoasting
cases:
  - name: one account requesting RC4 tickets for five distinct SPNs fires
    should_fire: true
    events_generator:
      count: 5
      window_seconds: 240
      template:
        EventID: 4769
        TicketEncryptionType: '0x17'
        TicketOptions: '0x40810000'
        TargetUserName: jsmith
        ServiceName: svc-app-{{i}}

  - name: four distinct SPNs stays under the threshold
    should_fire: false
    events_generator:
      count: 4
      window_seconds: 240
      template:
        EventID: 4769
        TicketEncryptionType: '0x17'
        TicketOptions: '0x40810000'
        TargetUserName: jsmith
        ServiceName: svc-app-{{i}}

  - name: AES tickets are not roastable and do not fire
    should_fire: false
    events_generator:
      count: 8
      window_seconds: 240
      template:
        EventID: 4769
        TicketEncryptionType: '0x12'
        TicketOptions: '0x40810000'
        TargetUserName: jsmith
        ServiceName: svc-app-{{i}}

  - name: machine-account service tickets are excluded
    should_fire: false
    events_generator:
      count: 8
      window_seconds: 240
      template:
        EventID: 4769
        TicketEncryptionType: '0x17'
        TicketOptions: '0x40810000'
        TargetUserName: jsmith
        ServiceName: WS-{{i}}$
