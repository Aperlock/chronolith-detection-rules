# B-008 — Password Change or Reset for a Privileged Account
title: Password Change or Reset for a Privileged Account
id: 8f2c1a4b-0e5d-4a6c-9b7e-2c3d4e5f0b08
status: experimental
description: >
  A password is changed or reset for a tier-0 or service account. Attackers rotate
  a compromised privileged account's password to lock out the legitimate owner and
  keep exclusive access. A reset by a different admin (4724) versus a self-change
  (4723) is a useful distinction during triage.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4724
author: Aperlock
date: 2026-08-06
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4723   # user changed own password
      - 4724   # admin reset another user's password
  condition: selection
fields:
  - TargetUserName
  - SubjectUserName
falsepositives:
  - Scheduled/enforced rotation and ordinary user password changes — this is only meaningful scoped to tier-0 + service accounts (Chronolith account classification); unscoped it fires on every password change
level: high
# Meaningful only when scoped to privileged/service accounts via the account
# classifier. Unscoped, 4723 fires on ordinary user changes — ship scoped.
