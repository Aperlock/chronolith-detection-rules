# E-001 — LSASS Credential Dumping
title: LSASS Credential Dumping via Process Creation or Memory Access
id: 7f3c1a2e-6b84-4d19-9c5a-2e8f0b1d4a37
status: experimental
description: >-
  Detects tooling that reads or dumps the memory of lsass.exe to harvest
  credentials — procdump with the -ma full-dump switch aimed at lsass,
  rundll32 driving comsvcs.dll MiniDump, or a Sysmon ProcessAccess (EID 10)
  handle to lsass.exe carrying the read/clone access masks operators use to
  scrape secrets. LSASS holds the plaintext-adjacent credential material
  (NTLM hashes, Kerberos tickets, cached logons) for every account signed in
  to a host; one successful dump on a domain-joined box can hand an attacker
  keys to the whole estate. For a lean SME team with no 24/7 SOC this is a
  drop-everything signal — legitimate reasons to dump lsass are rare and
  almost always planned, so a single occurrence is treated as critical.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
author: Aperlock
date: 2026-08-05
tags:
  - attack.credential-access
  - attack.t1003.001
# Spans two Windows sources, so logsource stays at product level rather than
# category: process_creation (which RULE_SCHEMA §4 maps to 4688 / Sysmon EID 1
# ONLY and would scope the Sysmon EID 10 ProcessAccess selection out). Each
# selection carries its own EventID, so routing is driven by EventID, not category.
logsource:
  product: windows
detection:
  # 4688 / Sysmon EID 1 (process creation) — command-line evidence of the tooling
  selection_procdump:
    EventID: 4688
    CommandLine|contains|all:
      - '-ma'
      - 'lsass'
  selection_comsvcs:
    EventID: 4688
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs.dll'
      - 'MiniDump'
  # Sysmon EID 10 (process access) — a handle to lsass with a credential-scrape mask
  selection_sysmon_access:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x143a'
  condition: 1 of selection_*
fields:
  - Computer
  - SubjectUserName
  - NewProcessName
  - Image
  - CommandLine
  - SourceImage
  - GrantedAccess
falsepositives:
  - Endpoint protection / EDR agents and native crash handlers (WerFault.exe)
    that legitimately open or dump lsass — identify the specific product path
    and SourceImage and exclude it. This rule ships no built-in exclusion, so a
    Sysmon-heavy estate should expect to tune selection_sysmon_access by SourceImage.
  - Planned incident-response or forensic collection where an admin knowingly
    runs procdump/comsvcs against lsass — correlate with a change ticket.
  - Performance/memory diagnostics of lsass requested by Microsoft support —
    rare and should be time-boxed and pre-announced.
level: critical
# PREREQUISITES / KNOWN COVERAGE LIMITS:
# - selection_procdump / selection_comsvcs rely on CommandLine in 4688, which
#   needs "Include command line in process creation events" (Administrative
#   Templates > System > Audit Process Creation) — OFF by default. Ship these two
#   selections DISABLED until command-line auditing is enabled fleet-wide, OR
#   route the same processes via Sysmon Event ID 1 (always carries CommandLine).
# - selection_sysmon_access requires Sysmon with ProcessAccess (EID 10) logging
#   of lsass.exe configured (not in a default Windows install).
# - Coverage gaps to be aware of: comsvcs invoked by ordinal ('#24' instead of
#   'MiniDump') evades selection_comsvcs, and GrantedAccess is an exact-match on
#   three common masks — variant masks (e.g. 0x1438, 0x1fffff) will not match.
