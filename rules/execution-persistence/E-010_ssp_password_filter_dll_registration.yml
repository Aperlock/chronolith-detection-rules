# E-010 — Authentication Process Modification: SSP / Password Filter DLL
# Requires a registry auditing SACL on HKLM\SYSTEM\CurrentControlSet\Control\Lsa
# (audit "Set Value") AND the "Audit Registry" subcategory (Object Access) enabled —
# both are OFF by default, so EventID 4657 will not be generated until they are set.
# Ship DISABLED by default until the SACL + auditpol are provisioned.
title: LSA Security/Notification Package Registry Modification (Malicious SSP or Password Filter DLL)
id: 9058777f-3440-4a42-ab06-46cc4d4bb256
status: experimental
description: >-
  Detects a value change (EventID 4657) to "Security Packages" or "Notification Packages"
  under HKLM\SYSTEM\CurrentControlSet\Control\Lsa. Registering a rogue Security Support
  Provider (SSP) or Password Filter DLL is a classic authentication-process subversion:
  LSASS loads the attacker's DLL and it receives every plaintext credential at logon or
  password change — the whole estate's passwords in cleartext. For a lean SME team with no
  24/7 SOC this is a hands-on-keyboard, post-domain-compromise action that almost never has
  a benign explanation, so a single occurrence is treated as critical and warrants immediate
  isolation of the host and forced credential rotation.
references:
  - https://attack.mitre.org/techniques/T1556/002/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4657
author: Aperlock
date: 2026-08-05
tags:
  - attack.credential-access
  - attack.defense-evasion
  - attack.persistence
  - attack.t1556.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4657
    ObjectName|contains: '\CurrentControlSet\Control\Lsa'
    ObjectValueName:
      - 'Security Packages'
      - 'Notification Packages'
  condition: selection
fields:
  - SubjectUserName
  - SubjectDomainName
  - ObjectName
  - ObjectValueName
  - OldValue
  - NewValue
  - ProcessName
  - Computer
falsepositives:
  - Installing or updating software that legitimately registers an SSP or password-filter DLL
    (e.g. enabling Credential Guard, a smartcard/PKI middleware, or a password-complexity
    enforcement product). Correlate the change with a known maintenance window and the
    installing process/account before dismissing.
  - Security baselining tools (SCM/DSC/GPO) reasserting the LSA package list. Attribute the
    change to the management ProcessName and account.
level: critical
