# E-009 — NTDS.dit Extraction
title: NTDS.dit Extraction from a Domain Controller
id: e0093f1a-4c7b-4d2e-9a61-3b8f2c5d7e04
status: experimental
description: >-
  Detects the primary hands-on techniques used to lift the Active Directory
  credential database (ntds.dit) off a domain controller: ntdsutil "ac i ntds ...
  ifm create" (native IFM dump), esentutl copying/repairing ntds.dit (often via
  its VSS switch), copying ntds.dit straight out of a Volume Shadow Copy device
  path, and vssadmin/wmic/diskshadow creating a volume shadow copy so the locked
  ntds.dit can be pulled out from underneath the running DC. A successful copy of
  ntds.dit plus the SYSTEM hive yields every domain hash — Kerberos golden-ticket
  and full-domain compromise material. For a lean SME with one or two DCs this is
  a break-glass, end-of-game event: a single occurrence on a domain controller
  should page a human immediately, not wait for a threshold.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
author: Aperlock
date: 2026-08-05
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_ntdsutil:
    Image|endswith: '\ntdsutil.exe'
    CommandLine|contains|all:
      - 'ntds'
      - 'ifm'
  selection_ntdsutil_ac:
    Image|endswith: '\ntdsutil.exe'
    CommandLine|contains|all:
      - 'ac i ntds'
      - 'create'
  selection_esentutl:
    Image|endswith: '\esentutl.exe'
    CommandLine|contains: 'ntds.dit'
  selection_esentutl_vss:
    Image|endswith: '\esentutl.exe'
    CommandLine|contains|all:
      - '/vss'
      - 'ntds'
  # High-fidelity: any process copying ntds.dit straight out of a shadow-copy
  # device path (copy/robocopy/esentutl from \\?\GLOBALROOT\...HarddiskVolumeShadowCopyN).
  # Backups never copy ntds.dit out to an operator path, so this carries almost no FP.
  selection_shadow_lift:
    CommandLine|contains|all:
      - 'HarddiskVolumeShadowCopy'
      - 'ntds'
  selection_vss_create:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'create'
      - 'shadow'
  selection_wmic_shadow:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'create'
  selection_diskshadow:
    Image|endswith: '\diskshadow.exe'
    CommandLine|contains: 'create'
  condition: 1 of selection_*
fields:
  - SubjectUserName
  - Image
  - CommandLine
  - ParentImage
  - Computer
falsepositives:
  - Legitimate Active Directory backup or DR tooling (Windows Server Backup, Veeam,
    Commvault) that snapshots the system volume or invokes esentutl for consistency
    checks — identify the service account/host and scope it out.
  - A domain admin performing a sanctioned DC migration/promotion using ntdsutil IFM
    to seed an RODC or install-from-media — correlate with an approved change ticket.
  - >-
    Scheduled VSS-based backups that shell out to vssadmin/wmic/diskshadow "create":
    on a DC that is backed up by a product invoking vssadmin.exe (not the VSS COM
    API), selection_vss_create/_wmic_shadow/_diskshadow will fire on EVERY backup
    window. Because this rule is single-occurrence critical, you MUST baseline the
    normal backup account, parent process, and window and allowlist them BEFORE
    enabling those three selections, or accept a recurring nightly page. The
    ntdsutil/esentutl/shadow-lift selections are unaffected by this and stay high-signal.
level: critical
# Requires command-line auditing in 4688 ("Include command line in process creation events",
# plus "Audit Process Creation") — OFF by default on Windows. On DCs the ntdsutil/vssadmin
# distinction lives entirely in CommandLine, so this rule ships DISABLED by default until
# command-line-in-4688 is enabled on the domain controllers (or process creation is sourced
# from Sysmon Event ID 1, which always carries CommandLine). Best scoped to DC hosts only.
# NOTE ON FIELDS: process_creation selections key on the Sigma-normalized Image/ParentImage
# fields (as with E-008/C-002/D-008), NOT the raw 4688 NewProcessName/ParentProcessName —
# Chronolith normalizes 4688 into the Sysmon-style schema before rules evaluate.
# Note: this is shadow copy CREATE + ntds.dit lift; shadow copy DELETION is covered by C-002.
