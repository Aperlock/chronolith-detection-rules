# A-003 — Password Spray: Multiple Accounts, Single Source
title: Password Spray - Multiple Accounts from One Source
name: password_spray_single_source
id: b1e6c2a0-1f34-4c7a-9d21-0a1b2c3d4003
status: experimental
description: >
  One source IP produces failed logons against many distinct accounts — low and
  slow credential guessing spread across users to stay under per-account lockout
  thresholds. Account diversity from a single origin is what separates this from
  A-001 brute force.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Aperlock
date: 2026-05-15
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    # THE SHARP FILTER, and the only one of the four in the spec a standalone Sigma rule can
    # apply. 0xC000006A is "bad password against an account that EXISTS" -- the shape of a
    # spray. 0xC0000064 is "no such user", which is enumeration, and 0xC0000234 is a lockout.
    # Without this the rule counts all three together and calls the total spray.
    SubStatus: '0xC000006A'
  condition: selection
fields:
  - IpAddress
  - TargetUserName
falsepositives:
  - A misconfigured service account cycling a wrong password across users — check
    whether the failures share a service logon context
  - >
    THIS RULE IS THE CARDINALITY SIGNAL ONLY, and on the architectures this product
    is sold into that is not sufficient on its own. A VPN concentrator, carrier NAT,
    a reverse proxy, or a public portal doing the AD bind all present ONE source
    address for a large legitimate population — which is indistinguishable from
    spray by account count alone. Expect this rule to fire on them.
  - >
    What separates the two needs state a standalone Sigma rule cannot hold:
    failure-only-distinct (accounts that failed and NEVER succeeded from that
    source, which collapses a legitimate portal to near zero), source baselining
    against what an address is known to do, and novelty of the failing account set.
    Chronolith applies all three; a rule file evaluated in isolation applies none of
    them. Treat a hit here as "look at this source", not as a confirmed spray.
level: high
---
# Threshold: same source IP hitting >= 20 distinct target accounts / 10 min.
# Was 8, which is a normal Monday behind a NAT egress. The spec's revised floor is ~20 and
# that figure was derived for the failure-only-distinct primitive, which a standalone rule
# cannot implement -- so 20 here is the same number doing LESS work, and is a floor rather
# than a tuned value. Raise it on a busy egress; do not lower it.
title: Password Spray - Multiple Accounts from One Source (threshold)
id: b1e6c2a0-1f34-4c7a-9d21-0a1b2c3d4103
status: experimental
correlation:
  type: value_count
  rules:
    - password_spray_single_source
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 20
