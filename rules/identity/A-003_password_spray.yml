# A-003 — Password Spray: Multiple Accounts, Single Source
title: Password Spray - Multiple Accounts from One Source
name: password_spray_single_source
id: b1e6c2a0-1f34-4c7a-9d21-0a1b2c3d4003
status: experimental
description: >
  One source IP produces failed logons against many distinct accounts — low and
  slow credential guessing spread across users to stay under per-account lockout
  thresholds. Account diversity from a single origin is what separates this from
  A-001 brute force.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Aperlock
date: 2026-05-15
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
fields:
  - IpAddress
  - TargetUserName
falsepositives:
  - A misconfigured service account cycling a wrong password across users — check
    whether the failures share a service logon context
  - A shared NAT/proxy egress IP aggregating many users' genuine mistakes
level: high
---
# Threshold: same source IP hitting >= 8 distinct target accounts / 10 min.
title: Password Spray - Multiple Accounts from One Source (threshold)
id: b1e6c2a0-1f34-4c7a-9d21-0a1b2c3d4103
status: experimental
correlation:
  type: value_count
  rules:
    - password_spray_single_source
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    field: TargetUserName
    gte: 8
