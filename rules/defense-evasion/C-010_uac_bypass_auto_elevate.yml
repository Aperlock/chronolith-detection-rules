# C-010 — UAC Bypass via Auto-Elevating Binary
title: UAC Bypass via Auto-Elevating Binary
id: c8f5a1b2-4d6e-4a7c-9b8d-0e1f2a3b0c10
status: experimental
description: >
  A shell (cmd/powershell) is spawned by a Windows auto-elevating binary —
  fodhelper, eventvwr, sdclt, or computerdefaults. That parent→child pair is the
  hallmark of a registry-hijack UAC bypass, running the child at high integrity
  with no prompt. These binaries do not normally launch shells, so this is a
  low-false-positive, high-value signal.
references:
  - https://attack.mitre.org/techniques/T1548/002/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
author: Aperlock
date: 2026-08-06
tags:
  - attack.privilege-escalation
  - attack.defense-evasion
  - attack.t1548.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
      - '\fodhelper.exe'
      - '\eventvwr.exe'
      - '\sdclt.exe'
      - '\computerdefaults.exe'
      - '\CompMgmtLauncher.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection
fields:
  - Image
  - CommandLine
  - ParentImage
  - SubjectUserName
falsepositives:
  - Very low — these auto-elevating binaries do not normally spawn a shell
level: high
# Requires process-creation logging (4688 or Sysmon EID 1); command line helps triage.
