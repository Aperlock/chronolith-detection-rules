# C-002 — Volume Shadow Copy Deletion / Recovery Disabled
title: Volume Shadow Copy Deletion or Recovery Disabled
name: shadow_copy_deletion
id: b1e6c2a0-1f34-4c7a-9d21-0a1b2c3d4006
status: stable
description: >
  Execution of commands that destroy Volume Shadow Copies or disable Windows
  recovery. This is a near-signature ransomware step performed immediately before
  encryption to prevent restore. Any single hit warrants immediate response.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Aperlock
date: 2026-05-15
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains: 'delete shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains: 'shadowcopy delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains: 'delete catalog'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains:
      - 'recoveryenabled no'
      - 'bootstatuspolicy ignoreallfailures'
  condition: 1 of selection_*
fields:
  - ComputerName
  - SubjectUserName
  - CommandLine
falsepositives:
  - Backup software that manages shadow copies — add known backup process paths to
    an exclusion list; genuine ad-hoc admin use is rare and worth confirming anyway
level: critical
# Single occurrence — no correlation document.
