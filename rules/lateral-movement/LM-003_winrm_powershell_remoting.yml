# LM-003 — WinRM / PowerShell Remoting Execution
title: PowerShell Remoting (WinRM) Remote Execution
id: 9a3d5e7f-1b2c-4d3e-8a4b-5c6d7e8f0103
status: experimental
description: >
  A process is spawned by wsmprovhost.exe — the host process for inbound PowerShell
  Remoting / WinRM sessions. Attackers use WinRM for fileless lateral execution.
  Legitimate remote administration uses it too, so the value is an unusual source,
  command, or target.
references:
  - https://attack.mitre.org/techniques/T1021/006/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688
author: Aperlock
date: 2026-08-06
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\wsmprovhost.exe'
  condition: selection
fields:
  - Image
  - CommandLine
  - ParentImage
  - SubjectUserName
falsepositives:
  - Legitimate remote administration (Ansible, DSC, admin scripts) also runs under wsmprovhost — allowlist known management hosts/accounts; the signal is an unexpected source or command
level: medium
# Requires process-creation logging with command line (4688 + "Include command line in
# process creation events", or Sysmon EID 1).
