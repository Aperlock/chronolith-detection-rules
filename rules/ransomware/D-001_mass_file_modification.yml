# D-001 — Ransomware Staging: Mass File Modification
title: Mass File Modification - Ransomware Staging
name: mass_file_modification
id: b1e6c2a0-1f34-4c7a-9d21-0a1b2c3d4007
status: experimental
description: >
  A single user or process modifies a very large number of files across
  directories in seconds — the characteristic footprint of ransomware encryption
  in progress. Time-to-isolate is everything once this fires.
references:
  - https://attack.mitre.org/techniques/T1486/
author: Aperlock
date: 2026-05-20
tags:
  - attack.impact
  - attack.t1486
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4663
    # ACCESSMASK IS A BITMASK AND SIGMA CANNOT TEST BITS. A write on a real 4663 arrives as
    # WriteData (0x2), AppendData (0x4), or the two combined (0x6) -- exact-matching 0x2 alone
    # silently missed most real encryption activity, which is the worst kind of wrong for a
    # ransomware rule: a FALSE NEGATIVE that reports nothing and looks healthy.
    #
    # `|contains` is NOT the fix and is worth saying so, because the sibling rule FS-001 uses
    # it: '0x6' does not contain the substring '0x2', while '0x20' does. Substring matching on
    # hex is arbitrary, not bitwise. Enumerating the masks that actually occur is honest, and
    # the list has to be extended when a new one shows up.
    AccessMask:
      - '0x2'     # WriteData
      - '0x4'     # AppendData
      - '0x6'     # WriteData | AppendData
  condition: selection
fields:
  - SubjectUserName
  - ProcessName
  - ObjectName
falsepositives:
  - Backup jobs, AV full scans, and software updates touching many files —
    exclusion lists for backup service accounts and known AV processes are
    essential before enabling this on a file server
level: critical
# Requires file-object auditing (SACLs) on monitored shares. Ship DISABLED by
# default — noisy without per-environment tuning. Becomes more reliable with the
# Chronolith agent's file-system monitoring.
---
# Threshold: same user/process >= 200 file modifications / 60 seconds.
title: Mass File Modification - Ransomware Staging (threshold)
id: b1e6c2a0-1f34-4c7a-9d21-0a1b2c3d4107
status: experimental
correlation:
  type: event_count
  rules:
    - mass_file_modification
  group-by:
    - SubjectUserName
    - ProcessName
  timespan: 60s
  condition:
    gte: 200
